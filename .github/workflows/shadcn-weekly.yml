name: Update shadcn styles
on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: shadcn-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    # The npm environment holds RELEASE_DEPLOY_KEY, the one actor main's ruleset lets skip a pull request.
    environment:
      name: npm
      deployment: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch upstream and regenerate all styles
        run: |
          pnpm update:shadcn
          pnpm generate
          pnpm format
      - name: Detect upstream updates
        if: always()
        id: changes
        run: |
          if test -n "$(git status --porcelain)"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check public APIs without accepting new baselines
        if: steps.changes.outputs.changed == 'true'
        run: pnpm check:api
      - name: Write patch change files for the regenerated styles
        if: steps.changes.outputs.changed == 'true'
        run: |
          pnpm exec node packages/tooling/shadcn-generator/src/release.mjs
          pnpm format
      - name: Validate release artifacts and npm aliases
        if: steps.changes.outputs.changed == 'true'
        run: pnpm validate
      # The key is written only for the push, so nothing fetched from upstream runs with it. main's CI then verifies the
      # commit and releases its change files.
      - name: Commit the update to main
        if: steps.changes.outputs.changed == 'true'
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'chore: update generated shadcn styles'
          key="$RUNNER_TEMP/release-deploy-key"
          (umask 077 && printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$key")
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes"
          remote="git@github.com:$GITHUB_REPOSITORY.git"
          # main may have moved on while the styles regenerated.
          git fetch "$remote" main
          git rebase FETCH_HEAD
          git push "$remote" HEAD:main
          rm -f "$key"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: shadcn-api-and-consumer-diagnostics
          path: |
            dist/api-report-temp/
            dist/style-consumers/*/dist/
          if-no-files-found: ignore
